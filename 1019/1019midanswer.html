<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>期中考對答案</title>
<style>
:root {
  --ans: #c62828;
  --used: #0b62a8;
  --muted: #6b6b6b;
}
body {
  margin: 0;
  background: #e6e6e6;
  color: #222;
  font-family: "Noto Sans TC", "Noto Sans CJK TC", "Microsoft JhengHei", sans-serif;
}
header {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 18px;
  padding: 8px 16px;
  background: #fafafa;
  border-bottom: 1px solid #c8c8c8;
}
header label { white-space: nowrap; }
header input {
  width: 9ch;
  padding: 3px 5px;
  font: 15px/1.2 ui-monospace, Consolas, "Cascadia Mono", monospace;
  border: 1px solid #aaa;
  border-radius: 3px;
}
header input#sid { width: 12ch; font-size: 18px; }
header input.used { border-color: var(--used); background: #eaf3fc; }
header input.bad { border-color: #d00; background: #fff0f0; }
header button { font: inherit; padding: 3px 10px; }
.hint { flex-basis: 100%; margin: 0; font-size: 13px; color: var(--muted); }
main { padding: 16px; }
svg.page {
  display: block;
  width: 100%;
  max-width: 1100px;
  margin: 0 auto 16px;
  background: #fff;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
}
foreignObject { overflow: visible; }
.box { position: relative; width: 100%; height: 100%; }
.ans {
  position: absolute;
  left: 0;
  bottom: 0;
  color: var(--ans);
  font-size: 36px;
  line-height: 1.1;
  white-space: nowrap;
}
.ans.wrap { right: 0; white-space: normal; }
.ans.plain { color: #222; }
.ans .note { color: var(--muted); font-size: 0.75em; }
.ans .used { color: var(--used); font-size: 0.8em; }
.ans sub, .ans sup { font-size: 0.7em; line-height: 0; }
text.fig {
  fill: var(--ans);
  font-family: "Noto Sans TC", "Noto Sans CJK TC", "Microsoft JhengHei", sans-serif;
  font-weight: 600;
}
text.given { fill: #8a8a8a; font-weight: 400; }
text.note { fill: var(--muted); font-weight: 400; }
rect.badge { fill: #f0a500; }
text.badge {
  fill: #000;
  font-family: "Noto Sans TC", "Noto Sans CJK TC", "Microsoft JhengHei", sans-serif;
  font-weight: 600;
}
</style>
</head>

</header>

const VIEW_H = {8: H, 9: 640};
const SVGNS = 'http://www.w3.org/2000/svg', XHTML = 'http://www.w3.org/1999/xhtml';
const ANS = '#c62828', SHADE = 'rgba(198, 40, 40, 0.45)';
const ov = {};

function el(tag, attrs, parent, ns = SVGNS) {
  const e = document.createElementNS(ns, tag);
  for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}
const $ = id => document.getElementById(id);
const X = x => x * K, Y = y => (H - y) * K;
// TikZ 圖中的點：o 是圖的原點，(tx, ty) 以 cm 為單位，s 是 scale
const tz = (o, tx, ty, s = 1) => [o[0] + s * CM * tx, o[1] + s * CM * ty];
const sup = n => `<sup>${n}</sup>`, sub = n => `<sub>${n}</sub>`;
// 把 x_1、x_{d+1}、x^2、x^{23} 寫成 HTML 的上下標
const md = s => s.replace(/_\{([^}]*)\}|_(\w)/g, (_, a, b) => sub(a ?? b))
  .replace(/\^\{([^}]*)\}|\^(\d+)/g, (_, a, b) => sup(a ?? b));
const esc = s => s.replace(/[&<>"]/g, ch => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[ch]));

// 不是一題一分的題目：[配分, 給分方式]
const POINTS = {19: [2, '本題兩分'], 31: [8, '每個 cube 1 分'], 65: [2, '本題兩分'],
  88: [6, '每個 row 1 分'], 89: [6, '每個 row 1 分'], 92: [4, '每個 row 1 分'], 93: [4, '每個 row 1 分']};
for (const n of [102, 103, 104, 105, 106, 108, 109, 110, 111, 112, 117, 118, 119]) POINTS[n] = [2, '每題兩分'];

function buildPages() {
  const main = document.querySelector('main');
  for (const p of [8, 9]) {
    const svg = el('svg', {class: 'page', viewBox: `0 0 ${W * K} ${VIEW_H[p] * K}`}, main);
    el('image', {href: BG[p], x: 0, y: 0, width: W * K, height: H * K}, svg);
    const badges = el('g', {}, svg);
    ov[p] = el('g', {}, svg);
    for (const [n, [pts, how]] of Object.entries(POINTS)) {
      const it = ITEMS[n];
      if (it.p !== p) continue;
      const g = el('g', {}, badges);
      el('title', {}, g).textContent = `第 ${n} 題 ${pts} 分：${how}`;
      const t = el('text', {x: X(it.l[0]), y: Y(it.l[1] + 10.5), 'font-size': 5.5 * K, class: 'badge',
        'text-anchor': 'middle', 'dominant-baseline': 'central'}, g);
      t.textContent = `${pts} 分`;
      const bb = t.getBBox();
      g.insertBefore(el('rect', {x: bb.x - 1.5 * K, y: bb.y - 0.5 * K, width: bb.width + 3 * K,
        height: bb.height + K, rx: 2 * K, class: 'badge'}), t);
    }
  }
}

// ---------- 把答案放進答案空白 ----------

function makeBox([p, x0, x1, y], html, cls) {
  const w = (x1 - x0) * K, h = 28 * K;
  const fo = el('foreignObject', {x: X(x0), y: Y(y) - 25 * K, width: w, height: h}, ov[p]);
  const box = el('div', {class: 'box'}, fo, XHTML);
  const ans = el('div', {class: 'ans ' + cls}, box, XHTML);
  ans.innerHTML = html;
  return {fo, ans, w, h};
}

// 依序找第一段（略縮字後）放得下的空白；都放不下就用最長的一段，先縮字，再換行
function put(n, html, cls = '') {
  const segs = ITEMS[n].s;
  const shrink = (r, min) => {
    for (let size = 9; r.ans.offsetWidth > r.w && size > min;) {
      size -= 0.5;
      r.ans.style.fontSize = size * K + 'px';
    }
  };
  for (const s of segs) {
    const r = makeBox(s, html, cls);
    shrink(r, 7.5);
    if (r.ans.offsetWidth <= r.w) return;
    r.fo.remove();
  }
  const s = segs.reduce((a, b) => (b[2] - b[1] > a[2] - a[1] ? b : a));
  const r = makeBox(s, html, cls);
  shrink(r, 7);
  let size = parseFloat(r.ans.style.fontSize || 9 * K) / K;
  const setSize = () => { r.ans.style.fontSize = size * K + 'px'; };
  if (r.ans.offsetWidth > r.w) {
    r.ans.classList.add('wrap');
    while (r.ans.offsetHeight > r.h && size > 5) { size -= 0.5; setSize(); }
  }
}
const withNote = (main, note) => `<div class="note">${note}</div><div>${main}</div>`;
const withUsed = (main, used) => (used ? `<div class="used">採用 ${used}</div><div>${main}</div>` : main);
// 容許誤差 1 ± pct% 的題目，在開頭的數字底下標出要對的有效位數：10% 兩位、1% 三位、0.01% 五位
function tol(s, pct) {
  const num = s.match(/^[\d.]+/)[0];
  let k = 1 - Math.round(Math.log10(pct / 100)), i = 0, seen = false;
  for (; i < num.length && k > 0; i++) {
    if (/[1-9]/.test(num[i]) || (seen && num[i] === '0')) { seen = true; k--; }
  }
  return `<u>${s.slice(0, i)}</u>${s.slice(i)}`;
}

function figText(p, [x, y], str, {size = 7.5, cls = 'fig'} = {}) {

  rows.forEach((row, r) => row.forEach((v, c) => {

}

// ---------- 有限體與多項式 ----------

function primeField(p) {
  return {
    q: p,
    add: (a, b) => (a + b) % p,
    sub: (a, b) => (a - b + p) % p,
    mul: (a, b) => (a * b) % p,
    name: a => String(a),
  };
}
const F2 = primeField(2), F5 = primeField(5);
// F4 = {0, 1, α, ᾱ} 以 0、1、2、3 表示（α 的多項式表示 00、01、10、11），加法是 XOR
const LOG4 = [null, 0, 1, 2], EXP4 = [1, 2, 3];
const F4 = {
  q: 4,
  add: (a, b) => a ^ b,
  sub: (a, b) => a ^ b,
  mul: (a, b) => (a && b ? EXP4[(LOG4[a] + LOG4[b]) % 3] : 0),
  name: a => ['0', '1', 'α', 'ᾱ'][a],
};

const trim = f => { while (f.length > 1 && f[f.length - 1] === 0) f.pop(); return f; };
// f 除以 monic 的 g，係數由低次到高次
function divmod(F, f, g) {
  const r = f.slice(), dg = g.length - 1;
  if (r.length - 1 < dg) return [[0], r];
  const q = new Array(r.length - dg).fill(0);
  for (let i = r.length - 1; i >= dg; i--) {
    const c = r[i];
    if (!c) continue;
    q[i - dg] = c;
    for (let j = 0; j <= dg; j++) r[i - dg + j] = F.sub(r[i - dg + j], F.mul(c, g[j]));
  }
  return [trim(q), trim(r.slice(0, dg))];
}
function* monics(F, d) {
  for (let m = 0; m < F.q ** d; m++) {
    const g = [];
    for (let i = 0, t = m; i < d; i++, t = Math.floor(t / F.q)) g.push(t % F.q);
    g.push(1);
    yield g;
  }
}
// 由低次往高次試除；試到 degree d 時，更低次的因式都已除盡，所以整除的 g 一定不可約
function factor(F, f) {
  const out = [];
  for (let d = 1; 2 * d <= f.length - 1; d++) {
    for (const g of monics(F, d)) {
      let m = 0;
      for (;;) {
        const [q, r] = divmod(F, f, g);
        if (r.some(c => c !== 0)) break;
        f = q;
        m++;
      }
      if (m) out.push([g, m]);
    }
  }
  if (f.length > 1) out.push([f, 1]);
  return out;
}
function polyStr(F, f) {
  const terms = [];
  for (let i = f.length - 1; i >= 0; i--) {
    if (!f[i]) continue;
    const c = f[i] === 1 && i > 0 ? '' : F.name(f[i]);
    terms.push(c + (i === 0 ? '' : i === 1 ? 'x' : 'x' + sup(i)));
  }
  return terms.join(' + ') || '0';
}
function factorStr(F, f) {
  const fs = factor(F, f);
  if (fs.length === 1 && fs[0][1] === 1) return '不可約';
  return fs.map(([g, m]) => `(${polyStr(F, g)})${m > 1 ? sup(m) : ''}`).join('');
}

// 在 m 維 hypercube 上找出 parity 不對的 faces，以及翻轉後能讓所有 faces 都對的頂點
// 頂點編號的最高位是第一個座標
function hyperDecode(m, bits, faces) {
  const coord = (v, t) => (v >> (m - 1 - t)) & 1;
  const wrongOf = bs => faces.filter(([, t, val]) =>
    bs.reduce((s, bit, v) => s ^ (coord(v, t) === val ? bit : 0), 0));
  const wrong = wrongOf(bits).map(f => f[0]);
  let e = -1;
  for (let v = 0; v < bits.length && e < 0; v++) {
    const t = bits.slice();
    t[v] ^= 1;
    if (!wrongOf(t).length) e = v;
  }
  const fixed = bits.slice();
  if (e >= 0) fixed[e] ^= 1;
  return {wrong, fixed, e};
}

// Venn diagram：每個區域是 [所在的圓, x, y, bit]；若 parity 全對，先翻轉只在紅色內的那格
const COLOR = {R: '紅', B: '藍', G: '綠', P: '紫'};
function vennDecode(regions, circles) {
  const bits = regions.map(r => r[3]);
  const wrongOf = () => circles.split('').filter(ch =>
    regions.reduce((s, r, i) => s ^ (r[0].includes(ch) ? bits[i] : 0), 0));
  let wrong = wrongOf();
  if (!wrong.length) {
    bits[regions.findIndex(r => r[0] === 'R')] ^= 1;
    wrong = wrongOf();
  }
  const e = regions.findIndex(r => r[0] === wrong.join(''));
  const fixed = bits.slice();
  fixed[e] ^= 1;
  return {wrong: wrong.map(ch => COLOR[ch]), fixed, e};
}

const isPrime = n => { for (let i = 2; i * i <= n; i++) if (n % i === 0) return false; return n > 1; };
function smallFactor(n) { for (let i = 2; ; i++) if (n % i === 0) return i; }
function fieldAns(p, lo, hi) {
  if (!isPrime(p)) return `無：${p} = ${smallFactor(p)} · ${p / smallFactor(p)} 不是質數`;
  let k = 1, q = p;
  while (q < lo) { q *= p; k++; }
  if (q <= hi) return `${q} = ${p}${sup(k)}`;
  return `無：${p}${sup(k - 1)} = ${q / p} &lt; ${lo}，${p}${sup(k)} = ${q} &gt; ${hi}`;
}
function powmod(x, e, m) {
  let r = 1;
  for (x %= m; e; e >>= 1, x = (x * x) % m) if (e & 1) r = (r * x) % m;
  return r;
}

// ---------- 學號與覆寫 ----------

const C_IN = {'0': 0, '1': 1, '2': 2, '3': 3, 'a': 2, 'α': 2, 'b': 3, 'A': 3, 'ᾱ': 3};
function readOverride(id, parse) {
  const inp = $(id), raw = inp.value.trim();
  inp.classList.remove('used', 'bad');
  if (!raw) return null;
  const v = parse(raw);
  inp.classList.add(v ? 'used' : 'bad');
  return v;
}
const digitsOf = (m, len = 8) => raw => {
  const v = [...raw].map(ch => (/\d/.test(ch) && +ch < m ? +ch : NaN));
  return v.length === len && v.every(x => !Number.isNaN(x)) ? v : null;
};

function state() {
  const sid = $('sid').value.trim();
  const digits = sid.replace(/\D/g, '');
  if (!digits) {
    for (const id of ['oN', 'oa', 'ob', 'oc', 'od']) $(id).placeholder = '';
    return null;
  }
  const Ntrue = ((BigInt(digits) * 67n) % 100000000n).toString().padStart(8, '0');
  $('oN').placeholder = Ntrue;
  const oN = readOverride('oN', digitsOf(10));
  const N = oN ? oN.join('') : Ntrue;
  const derived = m => [...N].map(ch => +ch % m);
  const t = {a: derived(2), b: derived(3), c: derived(4), d: derived(5)};
  const o = {
    a: readOverride('oa', digitsOf(2)),
    b: readOverride('ob', digitsOf(3)),
    c: readOverride('oc', raw => {
      const v = [...raw].map(ch => C_IN[ch]);
      return v.length === 8 && v.every(x => x !== undefined) ? v : null;
    }),
    d: readOverride('od', digitsOf(5)),
  };
  for (const k of 'abcd') $('o' + k).placeholder = t[k].join('');
  return {sid, Ntrue, N, oN: !!oN, t, o,
    a: o.a || t.a, b: o.b || t.b, c: o.c || t.c, d: o.d || t.d};
}

function render() {

    planes.forEach(([mask, val], k) => {

    });

    noteText(it.p, [it.l[0], it.l[1] - 19.5], '不限', 'middle');
  }

  // RM(2, 4) 的 hypercube，頂點編號 x1x2x3w
  const CUBES = [['上', 1, 1], ['下', 1, 0], ['左', 0, 0], ['右', 0, 1], ['前', 2, 0], ['後', 2, 1], ['東', 3, 1], ['西', 3, 0]];
  const tes = hyperDecode(4, [A(7), na(8), A(7), A(2), na(3), na(5), na(1), na(4),

    const [i, j, k, w] = [v >> 3 & 1, v >> 2 & 1, v >> 1 & 1, v & 1];

    grid(95, [[0, 1, 2, 3, 4, 5, 6].map(j => F4.name(G.reduce((s, row, i) => s ^ (row[j] ? v[i] : 0), 0)))]);
  }

  // 0907 週一作業：H 的第 j 個 row 是 j 的二進位表示
  {
    const u = [A(1), A(2), na(1), A(3), na(1), A(4), na(1)];
    const pos = u.reduce((s, bit, j) => s ^ (bit ? j + 1 : 0), 0);
    if (pos) u[pos - 1] ^= 1;
    grid(96, [u.map(String)]);
  }
  put(97, '16');
  put(98, '8');

  // 串接 channels
  put(99, tol('0.50000', 0.01));
  put(100, tol('0.99963712', 0.01));
  put(101, tol('3.605551（√13）', 0.01));

  // 不存在的 codes
  put(102, md('t = 2：2^23(1 + 31 + 465) = 2^23 · 497 &gt; 2^31 = 2^23 · 256'));
  put(103, 'Singleton bound');
  put(104, md('W_{C⊥} = X^5 + ½X^4Y + X^3Y^2 + 4X^2Y^3 + 2XY^4 − ½Y^5；負數：−½Y^5'));
  put(105, md('A_{d+1} = C(n, d + 1)(q − 1)(q − d)；q = 2、d = n − k + 1 ≥ 3 時為負（k ≥ 2 保證 d + 1 ≤ n）'));
  put(106, md('W = X^4 + 4(q − 1)XY^3 + (q − 1)(q − 3)Y^4；q = 2 時 A_4 = −1 &lt; 0'));
  put(107, 'DBACE');

  // 小堤的 finite fields，s = (−1)^{a_i}
  const sg = i => (A(i) ? -1 : 1);
  put(108, fieldAns(3, 2150 - 150 * sg(1), 2350 - 150 * sg(1)));
  put(109, fieldAns(7, 2400 + 100 * sg(2), 2600 + 100 * sg(2)));
  put(110, fieldAns(11, 1300 - 100 * sg(3), 1500 - 100 * sg(3)));
  put(111, fieldAns(5, 3100 + 100 * sg(4), 3300 + 100 * sg(4)));
  put(112, fieldAns(90 - sg(5), 8080 - 180 * sg(5), 8180 - 180 * sg(5)));

  // 小辜：p = 1297
  {
    let x = Number(BigInt(st.N) % 1297n);
    const bumped = [0, 1, 1296].includes(x);
    if (bumped) x += 5;
    put(113, bumped ? withNote(String(x), '已加 5') : String(x));
    const divs = [];
    for (let e = 1; e <= 1296; e++) if (1296 % e === 0) divs.push(e);
    put(114, String(divs.find(e => powmod(x, e, 1297) === 1)));
  }

  put(115, '16');
  put(116, '3');

  // BP update rule
  put(117, md('β + (1 − β^2)γ/(1 + βγ) = (β + β^2γ + γ − β^2γ)/(1 + βγ) = (β + γ)/(1 + βγ)'));
  put(118, '|β + (1 − |β|)γ| ≤ |β| + (1 − |β|)|γ| &lt; |β| + (1 − |β|) = 1');
  put(119, md('1 − ((β + γ)/(1 + βγ))^2 = (1 − β^2)(1 − γ^2)/(1 + βγ)^2 &gt; 0'));
}

buildPages();
const sid = $('sid');
sid.addEventListener('input', () => {
  for (const id of ['oN', 'oa', 'ob', 'oc', 'od']) $(id).value = '';
  render();
});
sid.addEventListener('focus', () => sid.select());
for (const id of ['oN', 'oa', 'ob', 'oc', 'od']) $(id).addEventListener('input', render);
$('clear').addEventListener('click', () => {
  for (const id of ['oN', 'oa', 'ob', 'oc', 'od']) $(id).value = '';
  render();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') sid.focus(); });
// 網址可以帶 #學號，方便直接開啟某位學生的答案
if (location.hash.length > 1) sid.value = decodeURIComponent(location.hash.slice(1));
render();
sid.focus();
</script>
